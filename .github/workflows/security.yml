name: Bounded security regression

on:
  # Temporarily manual: targeted parser review and new fuzz/fault work are paused.
  # A prior pass is retained as evidence, not complete release qualification.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-and-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build instrumented protocol dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake libssl-dev postgresql-server-dev-16
          python scripts/fetch_dependency.py proton "$RUNNER_TEMP/proton-src"
          cmake -S "$RUNNER_TEMP/proton-src" -B "$RUNNER_TEMP/proton-build" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/proton" \
            -DCMAKE_C_FLAGS='-fsanitize=fuzzer-no-link,address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DENABLE_UNDEFINED_ERROR=OFF -DENABLE_LINKTIME_OPTIMIZATION=OFF -DSSL_IMPL=openssl -DSASL_IMPL=none -DBUILD_CPP=OFF -DBUILD_PYTHON=OFF \
            -DBUILD_GO=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF
          cmake --build "$RUNNER_TEMP/proton-build" --parallel 2
          cmake --install "$RUNNER_TEMP/proton-build"
      - name: GCC static analysis of native extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-results/static
          for source in src/*.c; do
            gcc -c "$source" -o "security-results/static/$(basename "$source").o" \
              -Iinclude -I/usr/include/postgresql/16/server -I/usr/include/postgresql \
              -I"$RUNNER_TEMP/proton/include" -std=c11 -D_GNU_SOURCE \
              -Wall -Wextra -Wno-unused-parameter -Werror -fanalyzer \
              2>&1 | tee -a security-results/gcc-analyzer.txt
          done
      - name: Fuzz parser with ASAN and UBSAN
        shell: bash
        run: |
          set -euo pipefail
          python tests/fuzz/make_corpus.py "$RUNNER_TEMP/corpus"
          mkdir -p security-results/crashes
          clang tests/fuzz/proton_input.c -o "$RUNNER_TEMP/proton-fuzz" \
            -I"$RUNNER_TEMP/proton/include" -L"$RUNNER_TEMP/proton/lib" -lqpid-proton \
            -Wl,-rpath,"$RUNNER_TEMP/proton/lib" -fsanitize=fuzzer,address,undefined -g
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/proton-fuzz" "$RUNNER_TEMP/corpus" \
            -max_total_time=60 -timeout=3 -rss_limit_mb=1024 -max_len=65536 \
            -artifact_prefix=security-results/crashes/ 2>&1 | tee security-results/fuzz.txt
      - name: Keep reports and minimized failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-parser-static-evidence
          path: |
            security-results/*.txt
            security-results/crashes/
          if-no-files-found: warn
          retention-days: 14

  python-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit declared Python development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-dev.txt --format json --output python-dependency-audit.json
      - name: Preserve dependency advisory results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-dependency-advisories
          path: python-dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
