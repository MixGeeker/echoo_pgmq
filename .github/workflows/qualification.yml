name: Manual native qualification (requires security review)

# Retained intact for later reviewed qualification. Do not dispatch while
# qualification_status is blocked_security_review.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux PG${{ matrix.pg }} / native AMQP 1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        pg: ['18', '16', '17']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install independent JavaScript client from public npm lock
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/interop --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node tests/interop/verify_dependencies.js
      - name: Install signed PostgreSQL packages and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} build-essential cmake pkg-config libssl-dev
          echo "PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config" >> "$GITHUB_ENV"
          echo "PROTON_ROOT=$RUNNER_TEMP/proton" >> "$GITHUB_ENV"
      - name: Build verified Apache Proton with OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch_dependency.py proton "$RUNNER_TEMP/proton-src"
          cmake -S "$RUNNER_TEMP/proton-src" -B "$RUNNER_TEMP/proton-build" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="$PROTON_ROOT" \
            -DSSL_IMPL=openssl -DSASL_IMPL=none -DBUILD_CPP=OFF -DBUILD_PYTHON=OFF \
            -DBUILD_RUBY=OFF -DBUILD_GO=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF
          cmake --build "$RUNNER_TEMP/proton-build" --parallel 2
          cmake --install "$RUNNER_TEMP/proton-build"
          mkdir -p "$PROTON_ROOT/share/licenses/proton"
          cp "$RUNNER_TEMP/proton-src/LICENSE.txt" "$RUNNER_TEMP/proton-src/NOTICE.txt" "$PROTON_ROOT/share/licenses/proton/"
          echo "LD_LIBRARY_PATH=$PROTON_ROOT/lib:$PROTON_ROOT/lib64" >> "$GITHUB_ENV"
      - name: Compile and install extension
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPG_CONFIG="$PG_CONFIG" -DPROTON_ROOT="$PROTON_ROOT"
          cmake --build build --parallel 2
          sudo cmake --install build
          # Installed module has $ORIGIN rpath. System OpenSSL remains distribution-managed.
          sudo cp -L "$PROTON_ROOT"/lib/libqpid-proton*.so* "$($PG_CONFIG --pkglibdir)/"
          python -m pip install -r requirements-dev.txt
          python -m compileall -q scripts tests
      - name: Exercise installed extension, real protocol, upgrade, quota and process crashes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_integration.py --pg-config "$PG_CONFIG" --work-dir "$RUNNER_TEMP/evidence" --keep
      - name: Package candidate only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_candidate.py --pg-config "$PG_CONFIG" --build-dir build --proton-root "$PROTON_ROOT"
          python -m pip freeze > dist/python-build-inputs.txt
          "$PG_CONFIG" --configure > dist/postgres-build-options.txt
          ldd build/echoo_pgmq.so > dist/native-link-dependencies.txt
      - name: Install and exercise candidate archive without build-tree libraries
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find dist -maxdepth 1 -name '*.zip' -print -quit)
          sudo "$(command -v python)" scripts/install_candidate.py --archive "$archive" --pg-config "$PG_CONFIG" --disposable-installation
          env -u LD_LIBRARY_PATH -u PROTON_ROOT python scripts/run_integration.py \
            --pg-config "$PG_CONFIG" --work-dir "$RUNNER_TEMP/candidate-evidence" --keep
      - name: Preserve test evidence without data or private keys
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-pg${{ matrix.pg }}-evidence
          path: |
            ${{ runner.temp }}/evidence/postgres.log
            ${{ runner.temp }}/evidence/junit.xml
            ${{ runner.temp }}/evidence/environment.json
            ${{ runner.temp }}/candidate-evidence/postgres.log
            ${{ runner.temp }}/candidate-evidence/junit.xml
            ${{ runner.temp }}/candidate-evidence/environment.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload candidate, never publish a release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-pg${{ matrix.pg }}-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Native Windows Server 2022 PG${{ matrix.pg }} (not Windows 11 certification)
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: ['18', '16', '17']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install independent JavaScript client from public npm lock
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --prefix tests/interop --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { throw 'Independent client dependency installation failed' }
          node tests/interop/verify_dependencies.js
          if ($LASTEXITCODE -ne 0) { throw 'Independent client dependency verification failed' }
      - name: Install checksum-pinned native PostgreSQL binaries
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/fetch_dependency.py postgres-windows-${{ matrix.pg }} "$env:RUNNER_TEMP/postgres"
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL download/verification failed' }
          "PG_CONFIG=$env:RUNNER_TEMP/postgres/bin/pg_config.exe" >> $env:GITHUB_ENV
          "PROTON_ROOT=$env:RUNNER_TEMP/proton" >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP/postgres/bin" >> $env:GITHUB_PATH
          $sslRoots = @('C:/Program Files/OpenSSL', 'C:/Program Files/OpenSSL-Win64')
          $ssl = $sslRoots | Where-Object { Test-Path "$_/include/openssl/ssl.h" } | Select-Object -First 1
          if (!$ssl) { throw 'The runner must provide native OpenSSL headers/libraries; no silent TLS-free fallback' }
          "OPENSSL_ROOT_DIR=$ssl" >> $env:GITHUB_ENV
          "$ssl/bin" >> $env:GITHUB_PATH
      - name: Check native PostgreSQL runtime and restricted-token initialization
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/check_windows_runtime.py "$env:RUNNER_TEMP/postgres"
          if ($LASTEXITCODE -ne 0) { throw 'Native PostgreSQL runtime prerequisite failed' }
      - name: Build verified native Proton with OpenSSL (not SChannel)
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/fetch_dependency.py proton "$env:RUNNER_TEMP/proton-src"
          if ($LASTEXITCODE -ne 0) { throw 'Proton verification failed' }
          python scripts/patch_proton_windows.py "$env:RUNNER_TEMP/proton-src"
          if ($LASTEXITCODE -ne 0) { throw 'Verified Windows OpenSSL patch failed' }
          cmake -S "$env:RUNNER_TEMP/proton-src" -B "$env:RUNNER_TEMP/proton-build" -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$env:PROTON_ROOT" "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR" `
            -DSSL_IMPL=openssl -DSASL_IMPL=none -DBUILD_CPP=OFF -DBUILD_PYTHON=OFF `
            -DBUILD_RUBY=OFF -DBUILD_GO=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Proton configure failed' }
          cmake --build "$env:RUNNER_TEMP/proton-build" --config RelWithDebInfo --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Proton build failed' }
          cmake --install "$env:RUNNER_TEMP/proton-build" --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { throw 'Proton install failed' }
          New-Item -Type Directory -Force "$env:PROTON_ROOT/share/licenses/proton" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/proton-src/LICENSE.txt", "$env:RUNNER_TEMP/proton-src/NOTICE.txt" "$env:PROTON_ROOT/share/licenses/proton/"
          Copy-Item "$env:RUNNER_TEMP/proton-src/ECHOO_WINDOWS_OPENSSL_PATCH.txt" "$env:PROTON_ROOT/share/licenses/proton/"
          "$env:PROTON_ROOT/bin" >> $env:GITHUB_PATH
      - name: Compile and install native PostgreSQL DLL
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -A x64 "-DPG_CONFIG=$env:PG_CONFIG" "-DPROTON_ROOT=$env:PROTON_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'Extension configure failed' }
          cmake --build build --config RelWithDebInfo --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Extension build failed' }
          cmake --install build --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { throw 'Extension install failed' }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python test dependencies failed' }
          python -m compileall -q scripts tests
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
      - name: Test native Windows processes, TLS AMQP, upgrade and abrupt restart
        run: |
          python scripts/run_integration.py --pg-config "$env:PG_CONFIG" --work-dir "$env:RUNNER_TEMP/evidence" --keep
          if ($LASTEXITCODE -ne 0) { throw 'Integration tests failed' }
      - name: Package candidate only
        run: |
          python scripts/package_candidate.py --pg-config "$env:PG_CONFIG" --build-dir build --proton-root "$env:PROTON_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate packaging failed' }
          python -m pip freeze | Out-File -Encoding utf8 dist/python-build-inputs.txt
          & $env:PG_CONFIG --configure | Out-File -Encoding utf8 dist/postgres-build-options.txt
          openssl version -a | Out-File -Encoding utf8 dist/openssl-build-version.txt
      - name: Install and exercise candidate archive without build-tree DLL paths
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = (Get-ChildItem dist/*.zip | Select-Object -First 1).FullName
          python scripts/install_candidate.py --archive "$archive" --pg-config "$env:PG_CONFIG" --disposable-installation
          if ($LASTEXITCODE -ne 0) { throw 'Candidate archive verification/installation failed' }
          $env:ECHOO_TEST_OPENSSL = (Get-Command openssl).Source
          $protonBin = [IO.Path]::GetFullPath("$env:PROTON_ROOT/bin").TrimEnd('\')
          $opensslBin = [IO.Path]::GetFullPath("$env:OPENSSL_ROOT_DIR/bin").TrimEnd('\')
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and ([IO.Path]::GetFullPath($_).TrimEnd('\') -ine $protonBin) -and
            ([IO.Path]::GetFullPath($_).TrimEnd('\') -ine $opensslBin)
          }) -join ';'
          Remove-Item Env:PROTON_ROOT
          python scripts/run_integration.py --pg-config "$env:PG_CONFIG" --work-dir "$env:RUNNER_TEMP/candidate-evidence" --keep
          if ($LASTEXITCODE -ne 0) { throw 'Candidate-only integration tests failed' }
      - name: Preserve test evidence without data or private keys
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-server2022-pg${{ matrix.pg }}-evidence
          path: |
            ${{ runner.temp }}/evidence/postgres.log
            ${{ runner.temp }}/evidence/junit.xml
            ${{ runner.temp }}/evidence/environment.json
            ${{ runner.temp }}/candidate-evidence/postgres.log
            ${{ runner.temp }}/candidate-evidence/junit.xml
            ${{ runner.temp }}/candidate-evidence/environment.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload candidate, never publish a release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-server2022-pg${{ matrix.pg }}-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
